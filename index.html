<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Harlow & Vale - boutique property for Melbourne's inner north and east.">
<link rel="icon" type="image/webp" href="images/favicon.webp">
<link rel="preload" href="images/plan-dusk.png" as="image" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){var q=new URLSearchParams(location.search),c=document.documentElement.classList;if(q.has('demo'))c.add('demo');if(q.get('start')==='plan')c.add('start-plan');})();</script>
<title>Harlow & Vale</title>
<style>
:root{
  --limestone:#ECE7DF;
  --charcoal:#1F2326;
  --eucalyptus:#7C8C74;
  --brass:#B08D57;
  --muted:#8A9086;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--charcoal);color:var(--limestone);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%;height:auto;-webkit-user-drag:none;user-select:none}
h1,h2,h3,.serif{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:-0.01em}

/* Fixed design stage: 1080x1920. Scales to fit viewport. */
#fit{position:fixed;inset:0;display:grid;place-items:center;background:var(--charcoal);overflow:hidden}
#stage{
  width:1080px;height:1920px;position:relative;background:var(--charcoal);
  transform-origin:center center;flex:0 0 auto;
}

/* Plan: cropped dusk model at exact clip pixel position */
#plan{
  position:absolute;left:63px;top:260px;width:913px;height:1319px;
  z-index:1;pointer-events:none;
}
#plan img{width:913px;height:1319px;object-fit:fill}

/* Room labels - Inter 11px letter-spaced #B08D57, positions in stage coords */
.rlabel{
  position:absolute;z-index:3;pointer-events:none;
  font-family:Inter,sans-serif;font-size:11px;font-weight:500;
  letter-spacing:0.16em;text-transform:uppercase;color:var(--brass);
  text-shadow:0 1px 2px rgba(0,0,0,.55);
  opacity:0;transition:opacity .6s ease;
}
.ui-on .rlabel{opacity:1}
#lbl-living{left:250px;top:520px}
#lbl-dining{left:250px;top:760px}
#lbl-kitchen{left:720px;top:540px}
#lbl-bedroom{left:220px;top:1200px}
#lbl-hall{left:560px;top:1040px}
#lbl-bath{left:790px;top:1340px}

/* Invisible tap targets over rooms (stage coords) */
.hit{
  position:absolute;z-index:4;cursor:pointer;border-radius:8px;
  background:transparent;-webkit-tap-highlight-color:transparent;
}
.hit:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hit.active{box-shadow:inset 0 0 0 2px var(--brass)}
#hit-living{left:100px;top:320px;width:495px;height:580px}
#hit-kitchen{left:625px;top:320px;width:330px;height:580px}
#hit-bedroom{left:100px;top:950px;width:410px;height:605px}
#hit-hall{left:520px;top:950px;width:210px;height:230px}
#hit-bath{left:740px;top:1180px;width:215px;height:375px}

/* UI layer - fades in; keep y<288 clear of text */
#ui{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .9s ease}
.ui-on #ui{opacity:1}
#ui .interactive{pointer-events:auto}

/* Brand sits just below caption-safe zone */
.brand{
  position:absolute;left:0;right:0;top:300px;text-align:center;
  font-family:"Playfair Display",serif;font-size:20px;font-weight:600;
  letter-spacing:0.06em;color:var(--limestone);opacity:.78;
  pointer-events:none;
}
#stage.sheet-on .brand,#stage.cta-on .brand{opacity:0;transition:opacity .3s}
.brand span{opacity:.55}

/* Listings panel - lower overlay, does not move the plan */
#panel{
  position:absolute;left:40px;right:40px;top:1120px;height:420px;
  display:flex;flex-direction:column;gap:12px;justify-content:flex-end;
  pointer-events:none;
  transition:opacity .35s ease;
}
#stage.cta-on #panel{opacity:0;pointer-events:none}
#stage.sheet-on #panel{opacity:0;pointer-events:none}
#panel .interactive{pointer-events:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{
  padding:10px 16px;border-radius:999px;
  border:1px solid rgba(236,231,223,.28);background:rgba(31,35,38,.72);
  font-size:13px;font-weight:500;color:var(--limestone);
  transition:background .25s,border-color .25s,color .25s;
}
.chip.active{background:var(--limestone);color:var(--charcoal);border-color:var(--limestone)}
.cards{display:flex;gap:10px;justify-content:center;min-height:72px}
.card{
  flex:1 1 0;min-width:0;max-width:300px;
  background:rgba(236,231,223,.96);color:var(--charcoal);
  border-radius:12px;padding:12px 14px;
  opacity:1;transform:none;
  transition:opacity .4s ease, transform .4s ease;
}
.card.hide{opacity:0;transform:translateY(8px);pointer-events:none;position:absolute;width:0;height:0;overflow:hidden;padding:0;border:0}
.card .sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--eucalyptus);font-weight:600}
.card .title{font-family:"Playfair Display",serif;font-size:18px;margin:2px 0 4px;line-height:1.15}
.card .meta{font-size:12px;color:#5c635a}
.card .price{font-size:13px;font-weight:600;margin-top:4px}

.book-btn{
  align-self:center;margin-top:4px;
  padding:14px 28px;border-radius:999px;
  background:var(--brass);color:var(--charcoal);
  font-size:14px;font-weight:600;letter-spacing:.04em;
}

/* Bottom sheet for room */
#sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:20;
  background:var(--limestone);color:var(--charcoal);
  border-radius:22px 22px 0 0;
  padding:18px 22px 28px;
  transform:translateY(110%);
  transition:transform .35s ease-out;
  pointer-events:none;
  box-shadow:0 -12px 40px rgba(0,0,0,.35);
}
#sheet.open{transform:translateY(0);pointer-events:auto}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:rgba(31,35,38,.18);margin:0 auto 14px}
#sheet .shot{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#ddd}
#sheet .shot img{width:100%;height:100%;object-fit:cover}
#sheet .row{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;gap:12px}
#sheet h3{font-size:28px;line-height:1.1}
#sheet .size{font-size:14px;font-weight:600;color:var(--eucalyptus);letter-spacing:.04em}
#sheetClose{
  position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;
  background:rgba(31,35,38,.08);color:var(--charcoal);font-size:20px;line-height:1;
  display:grid;place-items:center;
}

/* Time picker overlay */
#picker{
  position:absolute;inset:0;z-index:25;background:rgba(31,35,38,.55);
  display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s;
}
#picker.open{opacity:1;pointer-events:auto}
#picker .card{
  width:min(560px,86%);background:var(--limestone);color:var(--charcoal);
  border-radius:20px;padding:28px 24px 24px;text-align:center;
  max-width:560px;
}
#picker h3{font-size:28px;margin-bottom:6px}
#picker p{color:#5c635a;font-size:14px;margin-bottom:16px}
.slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.slot{
  padding:12px 16px;border-radius:12px;min-width:120px;
  border:1px solid rgba(31,35,38,.14);background:#fff;
  font-size:14px;font-weight:500;color:var(--charcoal);
}
.slot.active{background:var(--charcoal);color:var(--limestone);border-color:var(--charcoal)}

/* Confirm tick */
#confirm{
  position:absolute;inset:0;z-index:30;background:rgba(31,35,38,.55);
  display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s;
}
#confirm.open{opacity:1;pointer-events:auto}
#confirm .card{
  width:min(480px,82%);background:var(--limestone);color:var(--charcoal);
  border-radius:20px;padding:32px 28px;text-align:center;max-width:480px;
}
.tick{
  width:64px;height:64px;margin:0 auto 14px;border-radius:50%;
  border:2px solid var(--brass);display:grid;place-items:center;
}
.tick svg{width:32px;height:32px;stroke:var(--brass);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
#confirm.open .tick svg{animation:draw .65s .1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#confirm h3{font-size:30px;margin-bottom:6px}
#confirm p{color:#5c635a}
#confirm .when{margin-top:14px;padding:12px;border-radius:12px;background:#fff;font-weight:600}

/* CTA bar - ~18% of 1920 ≈ 346px */
#cta{
  position:absolute;left:0;right:0;bottom:0;height:346px;z-index:15;
  background:var(--charcoal);color:#fff;
  display:flex;align-items:center;justify-content:center;text-align:center;
  padding:24px 36px;
  transform:translateY(105%);
  transition:transform .45s ease-out;
  pointer-events:none;
}
#cta.show{transform:translateY(0);pointer-events:auto}
#cta .line{
  font-family:"Playfair Display",serif;font-weight:600;
  font-size:44px;line-height:1.2;letter-spacing:-0.01em;
  max-width:920px;
}
#cta .line .dot{margin:0 .18em;opacity:.55}

/* Tap ripple */
.tap-ripple{
  position:absolute;width:56px;height:56px;border-radius:50%;pointer-events:none;z-index:40;
  border:2.5px solid var(--brass);transform:translate(-50%,-50%) scale(.35);opacity:0;
  left:0;top:0;
}
.tap-ripple.show{animation:ripple .55s ease-out forwards}
@keyframes ripple{0%{opacity:.95;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}

@media (prefers-reduced-motion: reduce){
  #sheet,#cta,#ui,.rlabel,#picker,#confirm{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div id="fit">
  <div id="stage" aria-label="Harlow and Vale">
    <div id="plan">
      <img src="images/plan-dusk.png" width="913" height="1319" alt="Furnished floor plan at dusk" decoding="sync" fetchpriority="high">
    </div>

    <div class="rlabel" id="lbl-living">Living</div>
    <div class="rlabel" id="lbl-dining">Dining</div>
    <div class="rlabel" id="lbl-kitchen">Kitchen</div>
    <div class="rlabel" id="lbl-bedroom">Bedroom</div>
    <div class="rlabel" id="lbl-hall">Hall</div>
    <div class="rlabel" id="lbl-bath">Bath</div>

    <button class="hit" id="hit-living" type="button" aria-label="Living" data-room="living"></button>
    <button class="hit" id="hit-kitchen" type="button" aria-label="Kitchen" data-room="kitchen"></button>
    <button class="hit" id="hit-bedroom" type="button" aria-label="Bedroom" data-room="bedroom"></button>
    <button class="hit" id="hit-hall" type="button" aria-label="Hall" data-room="hall"></button>
    <button class="hit" id="hit-bath" type="button" aria-label="Bath" data-room="bath"></button>

    <div id="ui">
      <div class="brand">Harlow <span>&amp;</span> Vale</div>
      <div id="panel">
        <div class="chips interactive" id="chips" role="listbox" aria-label="Filters">
          <button class="chip active" data-filter="all" role="option" aria-selected="true">All</button>
          <button class="chip" data-filter="Northcote" role="option">Northcote</button>
          <button class="chip" data-filter="Hawthorn" role="option">Hawthorn</button>
          <button class="chip" data-filter="3bed" role="option">3 bed</button>
        </div>
        <div class="cards interactive" id="cards"></div>
        <button class="book-btn interactive" id="bookBtn" type="button">Book inspection</button>
      </div>
    </div>

    <div id="sheet" aria-hidden="true">
      <div class="grab" aria-hidden="true"></div>
      <button id="sheetClose" type="button" aria-label="Close">&times;</button>
      <div class="shot"><img id="sheetImg" src="images/room-bedroom-plan.webp" alt=""></div>
      <div class="row">
        <h3 class="serif" id="sheetName">Bedroom</h3>
        <div class="size" id="sheetSize">16 m²</div>
      </div>
    </div>

    <div id="picker" aria-hidden="true">
      <div class="card">
        <h3 class="serif">Book inspection</h3>
        <p>Choose a time this Saturday</p>
        <div class="slots" id="slots">
          <button class="slot" data-time="Sat 9:30" type="button">Sat 9:30</button>
          <button class="slot" data-time="Sat 10:30" type="button">Sat 10:30</button>
          <button class="slot" data-time="Sat 12:00" type="button">Sat 12:00</button>
          <button class="slot" data-time="Sat 14:00" type="button">Sat 14:00</button>
        </div>
      </div>
    </div>

    <div id="confirm" aria-live="polite">
      <div class="card">
        <div class="tick" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <h3 class="serif">Inspection booked</h3>
        <p>See you at the property.</p>
        <div class="when" id="confirmWhen">Sat 10:30</div>
      </div>
    </div>

    <div id="cta" aria-hidden="true">
      <div class="line">Websites from $999 <span class="dot">·</span> Comment HOME</div>
    </div>

    <div class="tap-ripple" id="ripple" aria-hidden="true"></div>
  </div>
</div>

<script>
(function(){
  const DEMO = document.documentElement.classList.contains('demo');
  const stage = document.getElementById('stage');
  const fit = document.getElementById('fit');

  function layout(){
    const s = Math.min(fit.clientWidth / 1080, fit.clientHeight / 1920);
    stage.style.transform = 'scale(' + s + ')';
    window.__stageScale = s;
  }
  layout();
  addEventListener('resize', layout);

  const ROOMS = {
    living:  { name:'Living',  size:'28 m²', img:'images/room-living-plan.webp' },
    kitchen: { name:'Kitchen', size:'14 m²', img:'images/room-kitchen-plan.webp' },
    bedroom: { name:'Bedroom', size:'16 m²', img:'images/room-bedroom-plan.webp' },
    hall:    { name:'Hall',    size:'5 m²',  img:'images/room-hall-plan.webp' },
    bath:    { name:'Bath',    size:'6 m²',  img:'images/room-bath-plan.webp' }
  };

  const LISTINGS = [
    { id:'n1', suburb:'Northcote', title:'Sunlit terrace', beds:3, price:'$1,450,000 - $1,550,000', filterKeys:['Northcote','3bed'] },
    { id:'h1', suburb:'Hawthorn',  title:'North-facing home', beds:3, price:'$2,200,000 - $2,400,000', filterKeys:['Hawthorn','3bed'] },
    { id:'b1', suburb:'Brunswick', title:'Warehouse conversion', beds:2, price:'$1,150,000 - $1,250,000', filterKeys:[] }
  ];

  const cardsEl = document.getElementById('cards');
  const chipsEl = document.getElementById('chips');
  let filter = 'all';

  function renderCards(animate){
    const items = LISTINGS.filter(L => filter==='all' || L.filterKeys.indexOf(filter)>=0 || L.suburb===filter);
    const html = items.map(L =>
      '<article class="card" data-id="'+L.id+'">' +
        '<div class="sub">'+L.suburb+' · '+L.beds+' bed</div>' +
        '<div class="title">'+L.title+'</div>' +
        '<div class="price">'+L.price+'</div>' +
      '</article>'
    ).join('');
    if (!animate){ cardsEl.innerHTML = html; return; }
    cardsEl.style.opacity = '0';
    setTimeout(function(){
      cardsEl.innerHTML = html;
      cardsEl.style.transition = 'opacity .4s ease';
      requestAnimationFrame(function(){ cardsEl.style.opacity = '1'; });
    }, 180);
  }
  renderCards(false);

  chipsEl.addEventListener('click', function(e){
    const b = e.target.closest('.chip'); if(!b) return;
    chipsEl.querySelectorAll('.chip').forEach(function(c){
      const on = c===b; c.classList.toggle('active', on); c.setAttribute('aria-selected', on?'true':'false');
    });
    filter = b.dataset.filter;
    renderCards(true);
  });

  const sheet = document.getElementById('sheet');
  const sheetImg = document.getElementById('sheetImg');
  const sheetName = document.getElementById('sheetName');
  const sheetSize = document.getElementById('sheetSize');

  function openRoom(key){
    const R = ROOMS[key]; if(!R) return;
    document.querySelectorAll('.hit').forEach(function(h){ h.classList.toggle('active', h.dataset.room===key); });
    sheetImg.src = R.img; sheetImg.alt = R.name;
    sheetName.textContent = R.name;
    sheetSize.textContent = R.size;
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden','false');
    stage.classList.add('sheet-on');
  }
  function closeSheet(){
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden','true');
    stage.classList.remove('sheet-on');
    document.querySelectorAll('.hit').forEach(function(h){ h.classList.remove('active'); });
  }
  document.querySelectorAll('.hit').forEach(function(h){
    h.addEventListener('click', function(){ openRoom(h.dataset.room); });
  });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);

  const picker = document.getElementById('picker');
  const confirm = document.getElementById('confirm');
  const confirmWhen = document.getElementById('confirmWhen');
  document.getElementById('bookBtn').addEventListener('click', function(){
    picker.classList.add('open'); picker.setAttribute('aria-hidden','false');
  });
  document.getElementById('slots').addEventListener('click', function(e){
    const s = e.target.closest('.slot'); if(!s) return;
    document.querySelectorAll('.slot').forEach(function(x){ x.classList.toggle('active', x===s); });
    confirmWhen.textContent = s.dataset.time;
    picker.classList.remove('open'); picker.setAttribute('aria-hidden','true');
    confirm.classList.add('open');
    // retrigger tick anim
    const svg = confirm.querySelector('.tick svg');
    svg.style.animation = 'none';
    void svg.offsetWidth;
    svg.style.animation = '';
  });

  const cta = document.getElementById('cta');
  function showCta(){
    cta.classList.add('show');
    cta.setAttribute('aria-hidden','false');
    confirm.classList.remove('open');
    picker.classList.remove('open');
    closeSheet();
    stage.classList.add('cta-on');
  }

  /* Tap ripple in stage coordinates */
  const ripple = document.getElementById('ripple');
  function tapAt(x, y){
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.classList.remove('show');
    void ripple.offsetWidth;
    ripple.classList.add('show');
  }
  function stagePoint(el){
    const r = el.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    const s = window.__stageScale || 1;
    return { x: (r.left + r.width/2 - sr.left) / s, y: (r.top + r.height/2 - sr.top) / s };
  }
  function tapEl(el){
    const p = stagePoint(el);
    tapAt(p.x, p.y);
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  async function runDemo(){
    const beats = window.__beats = {};
    const t0 = performance.now();
    const mark = function(name){ beats[name] = +((performance.now()-t0)/1000).toFixed(3); };
    const waitUntil = async function(sec){
      const target = t0 + sec*1000;
      const ms = target - performance.now();
      if (ms > 0) await sleep(ms);
    };

    // 0-1.5s: UI fades in around locked plan
    mark('start');
    document.getElementById('stage').classList.add('ui-on');
    await waitUntil(1.5);
    mark('ui_in');

    // 1.5-4.5s: tap Bedroom, sheet opens
    const bed = document.getElementById('hit-bedroom');
    tapEl(bed);
    await sleep(120);
    openRoom('bedroom');
    mark('bedroom_open');
    await waitUntil(4.35);
    closeSheet();
    mark('bedroom_close');
    await waitUntil(4.5);

    // 4.5-7.5s: suburb filter chips, cards reflow
    const chipN = chipsEl.querySelector('[data-filter="Northcote"]');
    tapEl(chipN);
    await sleep(100);
    chipN.click();
    mark('chip_northcote');
    await waitUntil(5.7);
    const chip3 = chipsEl.querySelector('[data-filter="3bed"]');
    tapEl(chip3);
    await sleep(100);
    chip3.click();
    mark('chip_3bed');
    await waitUntil(7.5);

    // 7.5-10s: Book, pick Sat 10:30, tick
    const book = document.getElementById('bookBtn');
    tapEl(book);
    await sleep(100);
    book.click();
    mark('book_open');
    await waitUntil(8.5);
    const slot = document.querySelector('.slot[data-time="Sat 10:30"]');
    tapEl(slot);
    await sleep(100);
    slot.click();
    mark('slot_tick');
    await waitUntil(10.0);

    // 10-11.5s: CTA bar
    showCta();
    mark('cta');
    await waitUntil(11.5);
    mark('end');
    window.__demoDone = true;
  }

  // Reveal UI for non-demo too (after first paint of plan)
  if (DEMO){
    // Plan paints first; start demo immediately (UI fades 0-1.5s)
    requestAnimationFrame(function(){ runDemo(); });
  } else {
    // Static browse: show UI after a beat so first frame can be clean plan
    setTimeout(function(){ document.getElementById('stage').classList.add('ui-on'); }, 400);
  }

  // Expose helpers for Playwright checks
  window.__HV = {
    openRoom: openRoom, closeSheet: closeSheet, showCta: showCta,
    planRect: { left:63, top:260, width:913, height:1319 },
    tapAt: tapAt
  };
})();
</script>
</body>
</html>
