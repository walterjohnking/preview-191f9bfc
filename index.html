<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Harlow & Vale - boutique property for Melbourne's inner north and east.">
<link rel="icon" type="image/webp" href="images/favicon.webp">
<link rel="preload" href="images/plan-dusk.png" as="image" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){var q=new URLSearchParams(location.search),c=document.documentElement.classList;if(q.has('demo'))c.add('demo');if(q.get('start')==='plan')c.add('start-plan');})();</script>
<title>Harlow & Vale</title>
<style>
:root{
  --limestone:#ECE7DF;
  --charcoal:#1F2326;
  --eucalyptus:#7C8C74;
  --brass:#B08D57;
  --muted:#8A9086;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--charcoal);color:var(--limestone);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
img{display:block;max-width:100%;height:auto;-webkit-user-drag:none;user-select:none}
h1,h2,h3,.serif{font-family:"Playfair Display",Georgia,serif;font-weight:600;letter-spacing:-0.01em}

/* Fixed design stage: 1080x1920. Scales to fit viewport. */
#fit{position:fixed;inset:0;display:grid;place-items:center;background:var(--charcoal);overflow:hidden}
#stage{
  width:1080px;height:1920px;position:relative;background:var(--charcoal);
  transform-origin:center center;flex:0 0 auto;
}

/* Plan: cropped dusk model at exact clip pixel position */
#plan{
  position:absolute;left:63px;top:260px;width:913px;height:1319px;
  z-index:1;pointer-events:none;
}
#plan img{width:913px;height:1319px;object-fit:fill}

/* Room labels — phone-legible 30px with backing pill, inside rooms */
.rlabel{
  position:absolute;z-index:3;pointer-events:none;
  font-family:Inter,sans-serif;font-size:30px;font-weight:700;
  letter-spacing:0.1em;text-transform:uppercase;color:#F5F1EA;
  background:rgba(31,35,38,.78);
  padding:8px 16px;border-radius:999px;
  border:1px solid rgba(176,141,87,.55);
  opacity:0;transition:opacity .7s ease;
  line-height:1.1;white-space:nowrap;
}
.ui-on .rlabel{opacity:1}
/* Panel covers these rooms — keep labels hidden so they never ghost through cards */
.ui-on #lbl-bedroom,
.ui-on #lbl-hall,
.ui-on #lbl-bath{opacity:0 !important}
#lbl-living{left:210px;top:500px}
#lbl-kitchen{left:680px;top:520px}
#lbl-bedroom{left:180px;top:1170px}
#lbl-hall{left:530px;top:1020px}
#lbl-bath{left:760px;top:1280px}

/* Invisible tap targets over rooms (stage coords). Hall/study stay non-tappable. */
.hit{
  position:absolute;z-index:4;cursor:pointer;border-radius:8px;
  background:transparent;-webkit-tap-highlight-color:transparent;
}
.hit:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hit.active{box-shadow:inset 0 0 0 2px var(--brass)}
#hit-living{left:100px;top:320px;width:495px;height:580px}
#hit-kitchen{left:625px;top:320px;width:330px;height:580px}
#hit-bedroom{left:100px;top:950px;width:410px;height:605px}
#hit-bath{left:740px;top:1180px;width:215px;height:375px}

/* UI layer — soft fade ~1.2s; brand + card shells + text fade together */
#ui{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.ui-on #ui{opacity:1}
#ui .interactive{pointer-events:auto}

/* Brand — below caption-safe zone */
.brand{
  position:absolute;left:80px;right:80px;top:320px;text-align:center;
  font-family:"Playfair Display",serif;font-size:44px;font-weight:600;
  letter-spacing:0.05em;color:var(--limestone);opacity:.95;
  pointer-events:none;line-height:1.1;
  text-shadow:0 2px 10px rgba(0,0,0,.55);
}
/* Keep brand visible while room sheets are open — sheets sit below it */
#stage.price-on .brand,
#stage.picker-on .brand,
#stage.confirm-on .brand{opacity:0;transition:opacity .35s ease}
.brand span{opacity:.55}

/* Opaque limestone plates under listing cards — fade with #ui (no frame pop) */
#card-solids{
  position:absolute;left:80px;right:80px;top:1060px;height:150px;
  display:flex;gap:14px;justify-content:center;z-index:3;pointer-events:none;
  opacity:0;
  transition:opacity 1.2s ease, gap .4s ease;
}
.ui-on #card-solids{opacity:1}
#stage.price-on #card-solids,
#stage.picker-on #card-solids,
#stage.confirm-on #card-solids{opacity:0;transition:opacity .35s ease}
/* sheet-on: keep card solids + text visible so they never blank behind the sheet */
#card-solids .card-solid{
  flex:1 1 440px;min-width:0;max-width:440px;height:100%;
  background:#ECE7DF;border-radius:16px;
}

/* Listings panel — no suburb chips; entirely above y1480 */
#panel{
  position:absolute;left:80px;right:80px;top:1060px;height:420px;
  display:flex;flex-direction:column;gap:28px;justify-content:flex-start;
  pointer-events:none;
  transition:opacity .35s ease;
  overflow:visible;
  width:auto;max-width:920px;
}
#stage.price-on #panel,
#stage.picker-on #panel,
#stage.confirm-on #panel{opacity:0;pointer-events:none}
/* sheet-on: panel text stays visible under the sheet */
#panel .interactive{pointer-events:auto}
.cards{display:flex;gap:14px;justify-content:center;min-height:120px;overflow:hidden;width:100%;max-width:920px;margin:0 auto;position:relative}
.card{
  flex:1 1 440px;min-width:0;max-width:440px;
  position:relative;color:var(--charcoal);
  border-radius:16px;padding:0;
  border:1px solid rgba(176,141,87,.35);
  background:#ECE7DF;
  overflow:hidden;
}
.card-face{
  background:#ECE7DF;color:var(--charcoal);
  border-radius:15px;padding:22px 22px 24px;
  height:100%;box-sizing:border-box;
  isolation:isolate;
}
.card .sub{font-size:24px;letter-spacing:.08em;text-transform:uppercase;color:var(--eucalyptus);font-weight:700;line-height:1.2}
.card .title{font-family:"Playfair Display",serif;font-size:40px;margin:8px 0 0;line-height:1.15}

.book-btn{
  align-self:center;flex:0 0 auto;margin-top:8px;
  padding:20px 40px;border-radius:999px;
  background:var(--brass);color:var(--charcoal);
  font-size:40px;font-weight:700;letter-spacing:.03em;line-height:1.1;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
}

/* Room sheet — 0.35s ease open/close */
#sheet{
  position:absolute;left:80px;width:920px;right:auto;top:400px;bottom:auto;z-index:20;
  height:600px;max-height:600px;box-sizing:border-box;
  background:var(--limestone);color:var(--charcoal);
  border-radius:22px;
  padding:22px 26px 26px;
  transform:translateY(40px);opacity:0;
  /* transform only — opacity stays 0 or 1 so card+text never ghost over the UI */
  transition:transform .35s ease-in-out;
  pointer-events:none;
  box-shadow:0 18px 50px rgba(0,0,0,.4);
  overflow:hidden;
  isolation:isolate;
}
#sheet.open{transform:translateY(0);opacity:1;pointer-events:auto}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:rgba(31,35,38,.18);margin:0 auto 14px}
#sheet .shot{position:relative;width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#ddd;max-height:340px}
#sheet .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;transform:scale(1) translate(0,0);transform-origin:55% 40%;will-change:transform}
#sheet.open .shot img.drift{animation:photoDrift 1.8s linear forwards}
@keyframes photoDrift{
  from{transform:scale(1.0) translate(0,0)}
  to{transform:scale(1.09) translate(-2.4%,-1.6%)}
}
#sheet .row{display:flex;align-items:baseline;justify-content:space-between;margin-top:18px;gap:12px}
#sheet h3{font-size:48px;line-height:1.1}
#sheet .size{font-size:40px;font-weight:700;color:var(--eucalyptus);letter-spacing:.03em}
#sheetClose{
  position:absolute;top:18px;right:18px;z-index:2;
  width:52px;height:52px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:rgba(31,35,38,.45);color:#F5F1EA;font-size:30px;line-height:1;
  display:grid;place-items:center;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}

/* Price card — address + price only; eased 0.35s */
#priceCard{
  position:absolute;left:80px;width:920px;top:720px;z-index:18;
  background:var(--limestone);color:var(--charcoal);
  border-radius:22px;padding:36px 34px 40px;
  text-align:center;
  box-shadow:0 18px 50px rgba(0,0,0,.4);
  border:1.5px solid rgba(176,141,87,.4);
  transform:translateY(28px);opacity:0;
  transition:transform .35s ease-in-out, opacity .35s ease-in-out;
  pointer-events:none;
  box-sizing:border-box;
}
#priceCard.open{transform:translateY(0);opacity:1;pointer-events:auto}
#priceCard .sub{
  font-size:26px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--eucalyptus);font-weight:700;line-height:1.2;
}
#priceCard h3{font-size:52px;line-height:1.15;margin:10px 0 8px}
#priceCard .meta{font-size:30px;color:#3f453f;margin-bottom:18px}
#priceCard .addr{
  font-size:26px;color:#3f453f;margin-top:6px;letter-spacing:.01em;
  white-space:nowrap;
}
#priceCard .price{
  font-size:56px;font-weight:700;color:var(--charcoal);letter-spacing:-0.01em;line-height:1.1;
}
#priceCard .price-inner{transform:translateY(0) scale(1);transform-origin:center center;will-change:transform}
#priceCard.open .price-inner.settle{animation:priceSettle 1.8s linear forwards}
@keyframes priceSettle{
  from{transform:translateY(0) scale(1)}
  to{transform:translateY(-12px) scale(1.028)}
}
/* note: linear applied via rule below */
#picker.open .card.drift{animation:softDrift 1.7s linear forwards}
#confirm.open .card.drift{animation:softDrift 2.0s linear forwards}
@keyframes softDrift{
  from{transform:translateY(0) scale(1)}
  to{transform:translateY(-10px) scale(1.022)}
}

/* Time picker */
#picker{
  position:absolute;inset:0;z-index:25;background:transparent;
  display:grid;place-items:center;align-content:center;opacity:1;pointer-events:none;
  padding-bottom:420px;
}
#picker.open{pointer-events:auto}
#picker .scrim{
  position:absolute;inset:0;background:rgba(31,35,38,.55);
  opacity:0;transition:opacity .35s ease-out;pointer-events:none;
}
#picker.open .scrim{opacity:1}
#picker .card{
  position:relative;z-index:1;
  width:min(720px,920px);background:#ECE7DF;color:var(--charcoal);
  border-radius:22px;padding:36px 30px 30px;text-align:center;
  max-width:920px;flex:0 0 auto;box-sizing:border-box;
  opacity:0;transform:translateY(18px);
  transition:transform .35s ease-out, opacity .35s ease-out;
  isolation:isolate;
}
#picker.open .card{opacity:1;transform:translateY(0)}
#picker h3{font-size:48px;margin-bottom:10px;line-height:1.1}
#picker p{color:#3f453f;font-size:30px;margin-bottom:22px;line-height:1.3}
.slots{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.slot{
  padding:18px 26px;border-radius:14px;min-width:200px;
  border:1.5px solid rgba(31,35,38,.18);background:#fff;
  font-size:40px;font-weight:700;color:var(--charcoal);line-height:1.1;
  transition:background .25s ease,color .25s ease,border-color .25s ease;
}
.slot.active{background:var(--charcoal);color:var(--limestone);border-color:var(--charcoal)}

/* Confirm tick */
#confirm{
  position:absolute;inset:0;z-index:30;background:transparent;
  display:grid;place-items:center;opacity:1;pointer-events:none;
  padding-bottom:360px;
}
#confirm.open{pointer-events:auto}
#confirm .scrim{
  position:absolute;inset:0;background:rgba(31,35,38,.55);
  opacity:0;transition:opacity .35s ease-out;pointer-events:none;
}
#confirm.open .scrim{opacity:1}
#confirm .card{
  position:relative;z-index:1;
  width:min(680px,920px);background:#ECE7DF;color:var(--charcoal);
  border-radius:22px;padding:40px 34px;text-align:center;
  border:1.5px solid rgba(176,141,87,.45);
  max-width:920px;box-sizing:border-box;
  opacity:0;transform:translateY(14px);
  transition:transform .35s ease-out, opacity .35s ease-out;
  isolation:isolate;
}
#confirm.open .card{opacity:1;transform:translateY(0)}
.tick{
  width:80px;height:80px;margin:0 auto 18px;border-radius:50%;
  border:3px solid var(--brass);display:grid;place-items:center;
  transform:scale(.82);opacity:0;
  transition:transform .3s ease-out, opacity .3s ease-out;
}
#confirm.open .tick{transform:scale(1);opacity:1}
.tick svg{width:40px;height:40px;stroke:var(--brass);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40}
#confirm.open .tick svg{animation:draw .3s .05s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
#confirm h3{font-size:48px;margin-bottom:10px;line-height:1.1}
#confirm p{color:#3f453f;font-size:30px}
#confirm .when{margin-top:18px;padding:18px;border-radius:14px;background:#fff;font-weight:700;font-size:40px}

/* Tap ripple */
.tap-ripple{
  position:absolute;width:64px;height:64px;border-radius:50%;pointer-events:none;z-index:40;
  border:2.5px solid var(--brass);transform:translate(-50%,-50%) scale(.35);opacity:0;
  left:0;top:0;
}
.tap-ripple.show{animation:ripple .55s ease-out forwards}
@keyframes ripple{0%{opacity:.95;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.4)}}

@media (prefers-reduced-motion: reduce){
  #sheet,#ui,#panel,.rlabel,#picker,#confirm,#priceCard,#card-solids,.tick,.tick svg,#picker .card,#confirm .card,.card{
    transition:none !important;animation:none !important;
  }
}
/* Demo reel keeps cinematic eases even if OS asks to reduce motion */
html.demo #sheet{
  transition:transform .35s ease-in-out !important;
}
html.demo #ui{transition:opacity 1.2s ease !important}
html.demo #card-solids{transition:opacity 1.2s ease !important}
html.demo #priceCard{
  transition:transform .35s ease-in-out, opacity .35s ease-in-out !important;
}
html.demo #picker .scrim{transition:opacity .35s ease-out !important}
html.demo #picker .card{transition:transform .35s ease-out, opacity .35s ease-out !important}
html.demo #confirm .scrim{transition:opacity .35s ease-out !important}
html.demo #confirm .card{transition:transform .35s ease-out, opacity .35s ease-out !important}
html.demo #confirm{transition:opacity .35s ease-out !important}
html.demo .tick{transition:transform .3s ease-out, opacity .3s ease-out !important}
html.demo #confirm.open .tick svg{animation:draw .3s .05s ease forwards !important}
</style>
</head>
<body>
<div id="fit">
  <div id="stage" aria-label="Harlow and Vale">
    <div id="plan">
      <img src="images/plan-dusk.png" width="913" height="1319" alt="Furnished floor plan at dusk" decoding="sync" fetchpriority="high">
    </div>

    <div class="rlabel" id="lbl-living">Living</div>
    <div class="rlabel" id="lbl-kitchen">Kitchen</div>
    <div class="rlabel" id="lbl-bedroom">Bedroom</div>
    <div class="rlabel" id="lbl-hall">Hall</div>
    <div class="rlabel" id="lbl-bath">Bath</div>

    <button class="hit" id="hit-living" type="button" aria-label="Living" data-room="living"></button>
    <button class="hit" id="hit-kitchen" type="button" aria-label="Kitchen" data-room="kitchen"></button>
    <button class="hit" id="hit-bedroom" type="button" aria-label="Bedroom" data-room="bedroom"></button>
    <button class="hit" id="hit-bath" type="button" aria-label="Bath" data-room="bath"></button>

  <!-- Opaque card plates under #ui -->
  <div id="card-solids" aria-hidden="true">
    <div class="card-solid" data-for="n1"></div>
    <div class="card-solid" data-for="h1"></div>
  </div>

    <div id="ui">
      <div class="brand">Harlow <span>&amp;</span> Vale</div>
      <div id="panel">
        <div class="cards interactive" id="cards"></div>
        <button class="book-btn interactive" id="bookBtn" type="button">Book inspection</button>
      </div>
    </div>

    <div id="sheet" aria-hidden="true">
      <div class="grab" aria-hidden="true"></div>
      <div class="shot">
        <img id="sheetImg" src="images/room-bedroom-plan.webp" alt="">
        <button id="sheetClose" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="row">
        <h3 class="serif" id="sheetName">Bedroom</h3>
        <div class="size" id="sheetSize">16 m²</div>
      </div>
    </div>

    <div id="priceCard" aria-hidden="true">
      <div class="price-inner" id="priceInner">
        <div class="sub" id="priceSuburb">Northcote</div>
        <div class="addr" id="priceAddr">Mitchell Street, Northcote VIC</div>
        <h3 class="serif" id="priceTitle">Sunlit terrace</h3>
        <div class="meta" id="priceMeta">1 bedroom</div>
        <div class="price" id="priceValue">$1,450,000</div>
      </div>
    </div>

    <div id="picker" aria-hidden="true">
      <div class="scrim" aria-hidden="true"></div>
      <div class="card">
        <h3 class="serif">Book inspection</h3>
        <p>Choose a time this Saturday</p>
        <div class="slots" id="slots">
          <button class="slot" data-time="Sat 10:30" type="button">Sat 10:30</button>
          <button class="slot" data-time="Sat 12:00" type="button">Sat 12:00</button>
        </div>
      </div>
    </div>

    <div id="confirm" aria-live="polite">
      <div class="scrim" aria-hidden="true"></div>
      <div class="card">
        <div class="tick" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <h3 class="serif">Inspection booked</h3>
        <p>See you at the property.</p>
        <div class="when" id="confirmWhen">Sat 10:30</div>
      </div>
    </div>

    <div class="tap-ripple" id="ripple" aria-hidden="true"></div>
  </div>
</div>

<script>
(function(){
  const DEMO = document.documentElement.classList.contains('demo');
  const stage = document.getElementById('stage');
  const fit = document.getElementById('fit');

  function layout(){
    const s = Math.min(fit.clientWidth / 1080, fit.clientHeight / 1920);
    stage.style.transform = 'scale(' + s + ')';
    window.__stageScale = s;
  }
  layout();
  addEventListener('resize', layout);

  const ROOMS = {
    living:  { name:'Living',  size:'28 m²', img:'images/room-living-plan.webp' },
    kitchen: { name:'Kitchen', size:'14 m²', img:'images/room-kitchen-plan.webp' },
    bedroom: { name:'Bedroom', size:'16 m²', img:'images/room-bedroom-plan.webp' },
    bath:    { name:'Bath',    size:'6 m²',  img:'images/room-bath-plan.webp' }
  };

  /* Two listings — no prices on cards (price only on the price card) */
  const LISTINGS = [
    { id:'n1', suburb:'Northcote', title:'Sunlit terrace', beds:1, price:'$1,450,000' },
    { id:'h1', suburb:'Hawthorn',  title:'North-facing home', beds:1, price:'$2,200,000' }
  ];
  const FEATURED = LISTINGS[0];

  const cardsEl = document.getElementById('cards');
  function cardHTML(L){
    return '<article class="card" data-id="'+L.id+'">' +
      '<div class="card-face">' +
        '<div class="sub">'+L.suburb+' · '+L.beds+' bed</div>' +
        '<div class="title">'+L.title+'</div>' +
      '</div>' +
    '</article>';
  }
  cardsEl.innerHTML = LISTINGS.map(cardHTML).join('');

  // Seed price card from featured listing
  document.getElementById('priceSuburb').textContent = FEATURED.suburb;
  document.getElementById('priceAddr').textContent = 'Mitchell Street, Northcote VIC';
  document.getElementById('priceTitle').textContent = FEATURED.title;
  document.getElementById('priceMeta').textContent = FEATURED.beds + ' bedroom';
  document.getElementById('priceValue').textContent = FEATURED.price;

  const sheet = document.getElementById('sheet');
  const sheetImg = document.getElementById('sheetImg');
  const sheetName = document.getElementById('sheetName');
  const sheetSize = document.getElementById('sheetSize');
  const priceCard = document.getElementById('priceCard');

  function prepareRoom(key){
    const R = ROOMS[key]; if(!R) return null;
    document.querySelectorAll('.hit').forEach(function(h){ h.classList.toggle('active', h.dataset.room===key); });
    sheetImg.classList.remove('drift');
    sheetImg.style.animation = 'none';
    void sheetImg.offsetWidth;
    sheetImg.style.animation = '';
    sheetImg.src = R.img; sheetImg.alt = R.name;
    sheetName.textContent = R.name;
    sheetSize.textContent = R.size;
    return R;
  }
  function openRoom(key){
    if(!prepareRoom(key)) return;
    void sheet.offsetWidth;
    sheet.style.opacity = '';
    sheet.style.transform = '';
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden','false');
    stage.classList.add('sheet-on');
  }
  async function openSheetEased(key, waitUntil, t0, dur){
    if(!prepareRoom(key)) return;
    sheet.style.setProperty('transition', 'none', 'important');
    // Opaque from frame 0 of the open — card bg + text are one solid layer
    // (fading #sheet opacity makes cream wash out while dark text stays readable).
    sheet.style.opacity = '1';
    sheet.style.transform = 'translateY(40px)';
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden','false');
    stage.classList.add('sheet-on');
    var steps = 14;
    for (var i = 1; i <= steps; i++){
      await waitUntil(t0 + dur * i / steps);
      var e = easeInOut(i / steps);
      sheet.style.opacity = '1';
      sheet.style.transform = 'translateY(' + (40 * (1 - e)).toFixed(2) + 'px)';
    }
    sheet.style.opacity = '1';
    sheet.style.transform = 'translateY(0px)';
  }
  function closeSheet(){
    void sheet.offsetWidth;
    sheet.style.opacity = '';
    sheet.style.transform = '';
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden','true');
    stage.classList.remove('sheet-on');
    document.querySelectorAll('.hit').forEach(function(h){ h.classList.remove('active'); });
  }
  function easeInOut(p){
    return p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2) / 2;
  }
  async function closeSheetEased(waitUntil, t0, dur){
    sheet.setAttribute('aria-hidden','true');
    sheet.style.setProperty('transition', 'none', 'important');
    sheet.style.opacity = '1';
    var steps = 14;
    for (var i = 1; i <= steps; i++){
      await waitUntil(t0 + dur * i / steps);
      var e = easeInOut(i / steps);
      // Stay fully opaque while sliding out — same one-layer rule as open.
      sheet.style.opacity = '1';
      sheet.style.transform = 'translateY(' + (40 * e).toFixed(2) + 'px)';
    }
    stage.classList.remove('sheet-on');
    document.querySelectorAll('.hit').forEach(function(h){ h.classList.remove('active'); });
    sheet.getAnimations().forEach(function(a){ try{ a.cancel(); }catch(err){} });
    sheet.classList.remove('open');
    sheet.style.opacity = '';
    sheet.style.transform = '';
    sheet.style.removeProperty('transition');
  }
  async function closePriceEased(waitUntil, t0, dur){
    priceCard.setAttribute('aria-hidden','true');
    priceCard.style.setProperty('transition', 'none', 'important');
    var panel = document.getElementById('panel');
    var solids = document.getElementById('card-solids');
    if(panel){ panel.style.setProperty('transition','none','important'); panel.style.opacity='0'; }
    if(solids){ solids.style.setProperty('transition','none','important'); solids.style.opacity='0'; }
    var y0 = -10; // matches end of price settle hold
    var steps = 14;
    for (var i = 1; i <= steps; i++){
      await waitUntil(t0 + dur * i / steps);
      var e = easeInOut(i / steps);
      priceCard.style.opacity = String(1 - e);
      priceCard.style.transform = 'translateY(' + (y0 + (28 - y0) * e).toFixed(2) + 'px)';
      // Bring listing cards back in as the price card leaves (no single-frame pop)
      if(panel) panel.style.opacity = String(e);
      if(solids) solids.style.opacity = String(e);
    }
    stage.classList.remove('price-on');
    if(panel){ panel.style.opacity=''; panel.style.removeProperty('transition'); }
    if(solids){ solids.style.opacity=''; solids.style.removeProperty('transition'); }
    priceCard.getAnimations().forEach(function(a){ try{ a.cancel(); }catch(err){} });
    priceCard.classList.remove('open');
    priceCard.style.opacity = '';
    priceCard.style.transform = '';
    priceCard.style.removeProperty('transition');
  }
  function openPriceCard(){
    var inner = document.getElementById('priceInner');
    if(inner){ inner.classList.remove('settle'); inner.style.animation='none'; void inner.offsetWidth; inner.style.animation=''; }
    void priceCard.offsetWidth;
    priceCard.style.opacity = '';
    priceCard.style.transform = '';
    priceCard.classList.add('open');
    priceCard.setAttribute('aria-hidden','false');
    stage.classList.add('price-on');
  }
  async function openPriceEased(waitUntil, t0, dur){
    // Open card chrome without snapping panel away; fade panel out with the card in
    var inner = document.getElementById('priceInner');
    if(inner){ inner.classList.remove('settle'); inner.style.animation='none'; void inner.offsetWidth; inner.style.animation=''; }
    void priceCard.offsetWidth;
    priceCard.classList.add('open');
    priceCard.setAttribute('aria-hidden','false');
    priceCard.style.setProperty('transition', 'none', 'important');
    priceCard.style.opacity = '0';
    priceCard.style.transform = 'translateY(28px)';
    var panel = document.getElementById('panel');
    var solids = document.getElementById('card-solids');
    if(panel){ panel.style.setProperty('transition','none','important'); panel.style.opacity='1'; }
    if(solids){ solids.style.setProperty('transition','none','important'); solids.style.opacity='1'; }
    var steps = 14;
    for (var i = 1; i <= steps; i++){
      await waitUntil(t0 + dur * i / steps);
      var e = easeInOut(i / steps);
      priceCard.style.opacity = String(e);
      priceCard.style.transform = 'translateY(' + (28 * (1 - e)).toFixed(2) + 'px)';
      if(panel) panel.style.opacity = String(1 - e);
      if(solids) solids.style.opacity = String(1 - e);
    }
    stage.classList.add('price-on');
    if(panel){ panel.style.opacity=''; panel.style.removeProperty('transition'); }
    if(solids){ solids.style.opacity=''; solids.style.removeProperty('transition'); }
    priceCard.style.opacity = '1';
    priceCard.style.transform = 'translateY(0px)';
  }

  document.querySelectorAll('.hit').forEach(function(h){
    h.addEventListener('click', function(){ openRoom(h.dataset.room); });
  });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);

  const picker = document.getElementById('picker');
  const confirm = document.getElementById('confirm');
  const confirmWhen = document.getElementById('confirmWhen');
  async function openPickerEased(waitUntil, t0, dur){
    var panel = document.getElementById('panel');
    var solids = document.getElementById('card-solids');
    var card = picker.querySelector('.card');
    var scrim = picker.querySelector('.scrim');
    picker.setAttribute('aria-hidden','false');
    picker.classList.add('open');
    // Start from hidden card; CSS .open would fight us — drive opacity ourselves
    if(card){
      card.style.setProperty('transition','none','important');
      card.style.opacity = '0';
      card.style.transform = 'translateY(18px)';
    }
    if(scrim){
      scrim.style.setProperty('transition','none','important');
      scrim.style.opacity = '0';
    }
    if(panel){ panel.style.setProperty('transition','none','important'); panel.style.opacity = panel.style.opacity || '1'; if(getComputedStyle(panel).opacity==='0'){} else { panel.style.opacity='1'; } }
    if(solids){ solids.style.setProperty('transition','none','important'); solids.style.opacity='1'; }
    var steps = 14;
    for (var i = 1; i <= steps; i++){
      if(waitUntil) await waitUntil(t0 + dur * i / steps);
      else await sleep(dur * 1000 / steps);
      var e = easeInOut(i / steps);
      if(card){
        card.style.opacity = String(e);
        card.style.transform = 'translateY(' + (18 * (1 - e)).toFixed(2) + 'px)';
      }
      if(scrim) scrim.style.opacity = String(e);
      if(panel) panel.style.opacity = String(1 - e);
      if(solids) solids.style.opacity = String(1 - e);
    }
    stage.classList.add('picker-on');
    if(panel){ panel.style.opacity=''; panel.style.removeProperty('transition'); }
    if(solids){ solids.style.opacity=''; solids.style.removeProperty('transition'); }
    if(card){ card.style.opacity=''; card.style.transform=''; card.style.removeProperty('transition'); }
    if(scrim){ scrim.style.opacity=''; scrim.style.removeProperty('transition'); }
  }
  document.getElementById('bookBtn').addEventListener('click', function(){
    if(document.documentElement.classList.contains('demo')) return; // demo drives openPickerEased
    openPickerEased(null, 0, 0.35);
  });
  document.getElementById('slots').addEventListener('click', function(e){
    const s = e.target.closest('.slot'); if(!s) return;
    document.querySelectorAll('.slot').forEach(function(x){ x.classList.toggle('active', x===s); });
    confirmWhen.textContent = s.dataset.time;
    picker.classList.remove('open'); picker.setAttribute('aria-hidden','true');
    stage.classList.remove('picker-on');
    confirm.classList.add('open');
    stage.classList.add('confirm-on');
    // confirm .card/.scrim fade via CSS .open transitions
    const svg = confirm.querySelector('.tick svg');
    svg.style.animation = 'none';
    void svg.offsetWidth;
    svg.style.animation = '';
  });

  const ripple = document.getElementById('ripple');
  function tapAt(x, y){
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    ripple.classList.remove('show');
    void ripple.offsetWidth;
    ripple.classList.add('show');
  }
  function stagePoint(el){
    const r = el.getBoundingClientRect();
    const sr = stage.getBoundingClientRect();
    const s = window.__stageScale || 1;
    return { x: (r.left + r.width/2 - sr.left) / s, y: (r.top + r.height/2 - sr.top) / s };
  }
  function tapEl(el){
    const p = stagePoint(el);
    tapAt(p.x, p.y);
  }

  function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  async function runDemo(){
    const beats = window.__beats = {};
    const t0 = performance.now();
    const mark = function(name){ beats[name] = +((performance.now()-t0)/1000).toFixed(3); };
    const waitUntil = async function(sec){
      const target = t0 + sec*1000;
      const ms = target - performance.now();
      if (ms > 0) await sleep(ms);
    };

    // 0-1.2s: soft UI fade around locked plan (brand + cards together)
    mark('start');
    document.getElementById('stage').classList.add('ui-on');
    await waitUntil(1.2);
    mark('ui_in');
    // Soft listing-card breath so the 1.2→2.3s hold is not static (plan stays locked)
    var panelEl = document.getElementById('panel');
    if(panelEl){
      panelEl.style.transition = 'none';
      var b0 = 1.25, bDur = 1.0, bSteps = 30;
      for (var bi = 1; bi <= bSteps; bi++){
        await waitUntil(b0 + bDur * bi / bSteps);
        var bp = bi / bSteps;
        panelEl.style.transform = 'translateY(' + (-6*bp).toFixed(2) + 'px)';
      }
    }

    async function roomBeat(key, tapSec){
      const hit = document.getElementById('hit-' + (key === 'bath' ? 'bath' : key));
      await waitUntil(tapSec);
      tapEl(hit);
      // Open starts at tap; 0.35s continuous opacity ease (no end-of-ease pin jump)
      await openSheetEased(key, waitUntil, tapSec, 0.35);
      mark(key + '_open');
      // Photo drift only — sheet shell stays locked so it never creeps over the brand
      sheetImg.classList.remove('drift');
      sheetImg.style.transition = 'none';
      sheetImg.style.transformOrigin = '50% 40%';
      sheet.style.transform = 'translateY(0px)';
      var hold0 = tapSec + 0.35;
      var holdDur = 1.8;
      var holdSteps = 54;
      for (var hi = 1; hi <= holdSteps; hi++){
        await waitUntil(hold0 + holdDur * hi / holdSteps);
        var p = hi / holdSteps;
        var sc = 1 + 0.11 * p;
        var tx = -48 * p;
        var ty = -32 * p;
        sheetImg.style.transform = 'translate(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px) scale(' + sc.toFixed(4) + ')';
      }
      mark(key + '_close');
      await closeSheetEased(waitUntil, tapSec + 2.15, 0.35);
      sheetImg.style.transform = '';
      sheetImg.style.transformOrigin = '';
    }

    await roomBeat('living', 2.3);
    await roomBeat('kitchen', 4.8);
    await roomBeat('bedroom', 7.3);
    await roomBeat('bath', 9.8);

    // Price card 12.3–14.8s (0.35 in, ~1.8 hold, 0.35 out)
    await waitUntil(12.3);
    await openPriceEased(waitUntil, 12.3, 0.35);
    mark('price_in');
    var priceInner = document.getElementById('priceInner');
    if(priceInner){
      priceInner.classList.remove('settle');
      priceInner.style.transition = 'none';
      priceCard.style.transition = 'none';
      var p0 = 12.65, pDur = 1.8, pSteps = 54;
      for (var pi = 1; pi <= pSteps; pi++){
        await waitUntil(p0 + pDur * pi / pSteps);
        var pp = pi / pSteps;
        priceInner.style.transform = 'translateY(' + (-14*pp).toFixed(2) + 'px) scale(' + (1+0.03*pp).toFixed(4) + ')';
        priceCard.style.transform = 'translateY(' + (-10*pp).toFixed(2) + 'px)';
      }
    } else {
      await waitUntil(14.45);
    }
    mark('price_out');
    await closePriceEased(waitUntil, 14.45, 0.35);
    if(priceInner) priceInner.style.transform = '';

    // Book inspection: tap 14.8, pick ~16.5, tick settled 17.0, hold to 19.0
    await waitUntil(14.8);
    const book = document.getElementById('bookBtn');
    tapEl(book);
    await sleep(100);
    mark('book_open'); // keep beat at ~14.9; ease runs from tap
    // Opaque picker card + scrim fade together; listing cards ease out (no abrupt vanish)
    await openPickerEased(waitUntil, 14.9, 0.35);
    var pickerCard = picker.querySelector('.card');
    if(pickerCard){
      pickerCard.classList.remove('drift');
      pickerCard.style.transition = 'none';
      var k0 = 15.25, kDur = 1.25, kSteps = 38;
      for (var ki = 1; ki <= kSteps; ki++){
        await waitUntil(k0 + kDur * ki / kSteps);
        var kp = ki / kSteps;
        pickerCard.style.transform = 'translateY(' + (-22*kp).toFixed(2) + 'px) scale(' + (1+0.04*kp).toFixed(4) + ')';
      }
    } else {
      await waitUntil(16.5);
    }
    const slot = document.querySelector('.slot[data-time="Sat 10:30"]');
    if(pickerCard){
      pickerCard.style.transform = '';
      pickerCard.style.removeProperty('transition');
    }
    tapEl(slot);
    await sleep(100);
    // Manually crossfade picker → confirm as opaque layers (avoid CSS opacity snap under demo)
    var confirmCard = confirm.querySelector('.card');
    var confirmScrim = confirm.querySelector('.scrim');
    var pickerScrim = picker.querySelector('.scrim');
    confirmWhen.textContent = slot.dataset.time;
    document.querySelectorAll('.slot').forEach(function(x){ x.classList.toggle('active', x===slot); });
    confirm.classList.add('open');
    stage.classList.add('confirm-on');
    stage.classList.remove('picker-on');
    if(confirmCard){
      confirmCard.style.setProperty('transition','none','important');
      confirmCard.style.opacity='0';
      confirmCard.style.transform='translateY(14px)';
    }
    if(confirmScrim){ confirmScrim.style.setProperty('transition','none','important'); confirmScrim.style.opacity='0'; }
    if(pickerCard){ pickerCard.style.setProperty('transition','none','important'); }
    if(pickerScrim){ pickerScrim.style.setProperty('transition','none','important'); }
    mark('slot_tick');
    var o0 = 16.6, oDur = 0.35, oSteps = 14;
    for (var oi = 1; oi <= oSteps; oi++){
      await waitUntil(o0 + oDur * oi / oSteps);
      var oe = oi/oSteps;
      oe = oe < 0.5 ? 2*oe*oe : 1 - Math.pow(-2*oe+2,2)/2;
      if(pickerCard){
        pickerCard.style.opacity = String(1-oe);
        pickerCard.style.transform = 'translateY(' + (18*oe).toFixed(2) + 'px)';
      }
      if(pickerScrim) pickerScrim.style.opacity = String(1-oe);
      if(confirmCard){
        confirmCard.style.opacity = String(oe);
        confirmCard.style.transform = 'translateY(' + (14*(1-oe)).toFixed(2) + 'px)';
      }
      if(confirmScrim) confirmScrim.style.opacity = String(oe);
    }
    picker.classList.remove('open'); picker.setAttribute('aria-hidden','true');
    if(pickerCard){ pickerCard.style.opacity=''; pickerCard.style.transform=''; pickerCard.style.removeProperty('transition'); }
    if(pickerScrim){ pickerScrim.style.opacity=''; pickerScrim.style.removeProperty('transition'); }
    if(confirmCard){ confirmCard.style.opacity=''; confirmCard.style.transform=''; confirmCard.style.removeProperty('transition'); }
    if(confirmScrim){ confirmScrim.style.opacity=''; confirmScrim.style.removeProperty('transition'); }
    const svg = confirm.querySelector('.tick svg');
    if(svg){ svg.style.animation='none'; void svg.offsetWidth; svg.style.animation=''; }
    await waitUntil(17.0);
    mark('tick_settled');
    if(confirmCard){
      confirmCard.classList.remove('drift');
      confirmCard.style.transition = 'none';
      var c0 = 17.0, cDur = 2.0, cSteps = 60;
      for (var ci = 1; ci <= cSteps; ci++){
        await waitUntil(c0 + cDur * ci / cSteps);
        var cp = ci / cSteps;
        confirmCard.style.transform = 'translateY(' + (-22*cp).toFixed(2) + 'px) scale(' + (1+0.04*cp).toFixed(4) + ')';
      }
    } else {
      await waitUntil(19.0);
    }
    mark('end');
    window.__demoDone = true;
  }

  if (DEMO){
    requestAnimationFrame(function(){ runDemo(); });
  } else {
    setTimeout(function(){ document.getElementById('stage').classList.add('ui-on'); }, 400);
  }

  window.__HV = {
    openRoom: openRoom, closeSheet: closeSheet, openSheetEased: openSheetEased,
    planRect: { left:63, top:260, width:913, height:1319 },
    tapAt: tapAt
  };
})();
</script>
</body>
</html>
